name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          python - <<'PY'
          import json, re
          from playwright.sync_api import sync_playwright
          U = "https://petnavi.niconote.jp"
          with sync_playwright() as p:
              b = p.chromium.launch()
              import urllib.parse
              pg = b.new_page(viewport={"width": 1280, "height": 900})
              for q in ["ペット 栃木県", "ペット 栃木県 貸切", "ペット 栃木県 ドッグラン", "ペット 栃木県 温泉", "ペット 栃木県 大型犬", "ペット 栃木県 部屋食", "ペット 栃木県 猫"]:
                  pg.goto("https://kw.travel.rakuten.co.jp/keyword/Search.do?charset=utf-8&f_query=" + urllib.parse.quote(q), timeout=60000); pg.wait_for_timeout(3500)
                  t = pg.inner_text("body")
                  m = re.search(r"([0-9,]+)\s*件", t)
                  names = pg.evaluate("[...document.querySelectorAll('h2 a, .hotelName a, a[href*=\"/HOTEL/\"]')].map(a=>a.textContent.trim()).filter(x=>x.length>3).slice(0,4)")
                  print("KW", q, "|", m.group(1) if m else "?", "|", names)
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
