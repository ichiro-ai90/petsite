name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Yahoo の商品検索が動くか（値は出さない）
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          python3 - <<'PY'
          import os, json
          import fetch_prices as f
          d = f._get(f.YAHOO_URL, {"appid": os.environ["YAHOO_APP_ID"], "query": "首輪", "results": 3, "genre_category_id": 2147})
          print("Y 2147 total", d.get("totalResultsAvailable"), [ (h.get("genreCategory") or {}).get("name") for h in d.get("hits",[])], [(h.get("parentGenreCategories") or [{}])[0].get("name") for h in d.get("hits",[])])
          d = f._get(f.YAHOO_URL, {"appid": os.environ["YAHOO_APP_ID"], "query": "首輪", "results": 3})
          print("Y nogenre", [((h.get("parentGenreCategories") or [{}])[0].get("id"), (h.get("parentGenreCategories") or [{}])[0].get("name")) for h in d.get("hits",[])])
          r = f._call(f.ITEM_URL, {"keyword": "首輪", "hits": 3, "genreId": 101213, "availability": 1})
          print("R 101213 count", r.get("count"), [it.get("genreId") for it in r.get("Items",[])], list((r.get("Items") or [{}])[0].keys())[:40])
          PY
