name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: その場検索の本番確認
        run: |
          for q in 首輪 ちゅーる; do
            curl -s "https://petnavi.niconote.jp/api/msearch?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" $q)" -o r.json -w "HTTP %{http_code}\n"
            python3 -c "import json;d=json.load(open('r.json'));it=d.get('items',[]);print('$q', len(it), 'rakuten', sum(1 for x in it if x['m']=='r'), 'yahoo', sum(1 for x in it if x['m']=='y'), 'err', d.get('err'), 'min', it[0]['p'] if it else None, (it[0]['n'][:30] if it else ''))"
          done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              for w, h, n in ((1440, 900, "pc"), (390, 844, "sp")):
                  pg = b.new_page(viewport={"width": w, "height": h})
                  pg.goto("https://petnavi.niconote.jp/?v=1117"); pg.wait_for_timeout(2500); pg.screenshot(path=f"home_{n}.png")
              pg = b.new_page(viewport={"width": 390, "height": 1400})
              pg.goto("https://petnavi.niconote.jp/search.html?q=%E9%A6%96%E8%BC%AA"); pg.wait_for_timeout(5000); pg.screenshot(path="search_sp.png")
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: "*.png", retention-days: 1 }
