name: daily-price-update
on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 05:17 JST（UTC 20:17）。混雑を避けて分をずらす
  workflow_dispatch:
permissions:
  contents: write
  deployments: write
concurrency:            # 手動実行と定期実行が重なっても push が衝突しないように
  group: daily-price-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}   # 楽天 API の Origin ヘッダー用＝ドメインだけ（https://ichiro-ai90.github.io、末尾スラッシュ・パスなし）
      PETSITE_PROD: "1"                      # 本番。楽天 Secrets 未設定ならサンプルに落とさず失敗させる（11/02 失敗モード対策）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: test amount()（内容量読み取りが壊れていたら公開しない）
        run: python tests_amount.py && python tests_fetch.py && python tests_gate.py
      - name: fetch prices（失敗・0件のカテゴリは前回データを引き継ぐ。公開できるデータが無ければ失敗）
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          VC_AFFILIATE_ID: ${{ secrets.VC_AFFILIATE_ID }}
        run: python fetch_prices.py
      - name: record history（価格の履歴を data/history.json に積む）
        run: python record_history.py
      - name: guard（本番でサンプル・空データを公開しない）
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/prices.json", encoding="utf-8"))
          if str(d.get("fetched_at", "")).startswith("SAMPLE"):
              sys.exit("::error::本番でサンプルデータが data/prices.json に入っています。公開を中止します")
          if not d.get("products"):
              sys.exit("::error::商品0件。公開を中止します")
          print("guard ok:", d["fetched_at"], len(d["products"]), "製品")
          PY
      - name: build（sitemap の URL はサイトの実 URL＝ドメイン＋/リポジトリ名。11/02 22:5x ランブック照合で修正）
        env:
          SITE_ORIGIN: ${{ vars.PUBLIC_ORIGIN || 'https://petsite-ichiro.pages.dev' }}   # 公開先（Cloudflare Pages）。GitHub Pages には公開しない（2026-11 規約上の理由）
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}   # Google アナリティクス（未設定なら入れない）
        run: python build.py
      - name: commit price snapshot（価格履歴を残す）
        run: |
          git config user.name "ichiro-bot"; git config user.email "ichiro-bot@users.noreply.github.com"
          git add data/prices.json data/history.json && git commit -m "prices $(date -u +%F)" || echo "no change"
          git push
      - name: deploy to Cloudflare Pages（プロジェクトが無ければ作る。2回目以降は「既にある」で先へ進む）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT || 'petsite-ichiro' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare の Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）が未設定です"; exit 1; }
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main || echo "project exists"
          npx --yes wrangler@3 pages deploy site --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
