name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          import json, re, urllib.parse
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 390, "height": 900})
              pg.goto("https://petnavi.niconote.jp/?v=1121f"); pg.wait_for_timeout(3000)
              g = json.loads(pg.evaluate("document.getElementById('gdata').textContent"))
              bad = [x["n"] for x in g if re.search(r"砂|シーツ|ティッシュ|消臭|除菌|トイレ|おむつ|マナー|ペレット|ゴミ袋|うんち", x["n"])]
              print("GN", len(g), "bad", len(bad), bad[:5])
              print("GTOP", [ (x["n"][:24], x["c"]) for x in g[:8]])
              print("GS", pg.evaluate("document.querySelector('.gc-s').textContent"))
              pg.locator("#gacha").scroll_into_view_if_needed(); pg.locator("#gacha").screenshot(path="gacha.png")
              pg.click("#gbtn"); pg.wait_for_timeout(4500)
              print("GCARD", pg.evaluate("(document.getElementById('gcard')||{}).textContent||''")[:120])
              pg.locator("#gacha").screenshot(path="gacha_pull.png")
              pg.goto("https://petnavi.niconote.jp/api/hotels?v=1121f&area=" + urllib.parse.quote("長野県"))
              d = json.loads(pg.inner_text("body")); print("HOT tot", d.get("tot"), "n", len(d.get("hotels", [])), "err", repr(d.get("err")))
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
