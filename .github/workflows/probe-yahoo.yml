name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: guide links and photos
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p shots/img
          echo skip-commons
          python probe_links.py
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && git add shots && git commit -qm "guide data [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
