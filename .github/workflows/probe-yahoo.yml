name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: dev/travel-premium, path: pv }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PR版を作る
        run: |
          cd pv && python auto/get_prices.py && python build.py >/dev/null && (cd site && python -m http.server 8000 >/dev/null 2>&1 &) && sleep 2
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          import json, re, urllib.parse
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 390, "height": 844})
              pg.goto("http://localhost:8000/travel.html"); pg.wait_for_timeout(2000)
              pg.screenshot(path="tv_full.png", full_page=True)
              pg.screenshot(path="tv_1.png")
              pg.evaluate("""(()=>{var x=[...document.querySelectorAll('.tv-pf button')].find(e=>e.textContent.trim()==='長野県');x&&x.click()})()""")
              pg.wait_for_timeout(2500); pg.locator("#tvh").scroll_into_view_if_needed(); pg.screenshot(path="tv_res.png")
              pc = b.new_page(viewport={"width": 1440, "height": 900})
              pc.goto("http://localhost:8000/travel.html"); pc.wait_for_timeout(1500); pc.screenshot(path="tv_pc.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
