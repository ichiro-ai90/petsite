name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 390, "height": 900})
              pg.goto("https://petnavi.niconote.jp/?v=1120a"); pg.wait_for_timeout(4000)
              print("BNB", pg.evaluate("(document.querySelector('.bn-b .bn-t')||{}).textContent"), pg.evaluate("(document.querySelector('.bn-b .bn-im')||{}).src"))
              print("TL", pg.evaluate("[...document.querySelectorAll('.tl')].slice(0,3).map(e=>e.innerText.replace(/\\n/g,' ')).join(' | ')"))
              pg.evaluate("document.getElementById('bns').scrollTo({left:document.querySelector('.bn').offsetWidth+10})"); pg.wait_for_timeout(800)
              pg.locator(".bn-b").screenshot(path="bnb.png"); pg.locator(".tls").screenshot(path="tls.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
