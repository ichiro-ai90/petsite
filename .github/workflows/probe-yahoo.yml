name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: honda dog
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p shots/honda
          python - <<'PY'
          import json, re, time, urllib.request
          from playwright.sync_api import sync_playwright
          print(urllib.request.urlopen("https://www.honda.co.jp/robots.txt").read().decode()[:1500])
          PREFS = "hokkaido aomori iwate miyagi akita yamagata fukushima ibaraki tochigi gunma saitama chiba tokyo kanagawa niigata toyama ishikawa fukui yamanashi nagano gifu shizuoka aichi mie shiga kyoto osaka hyogo nara wakayama tottori shimane okayama hiroshima yamaguchi tokushima kagawa ehime kochi fukuoka saga nagasaki kumamoto oita miyazaki kagoshima okinawa".split()
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              for pf in PREFS:
                  out = []
                  try:
                      pg.goto(f"https://www.honda.co.jp/dog/travel/{pf}/", timeout=60000); pg.wait_for_timeout(4000)
                      cards = pg.evaluate("""[...document.querySelectorAll('a[href*="/dog/travel/data/"]')].map(a=>{let c=a.closest('li')||a.parentElement;return {u:a.href,t:(c.innerText||'').replace(/\\s+/g,' ').slice(0,300)}})""")
                  except Exception as e:
                      print(pf, "ERR", e); cards = []
                  seen = set(); cards = [c for c in cards if not (c['u'] in seen or seen.add(c['u']))]
                  print(pf, len(cards), flush=True)
                  n = 0
                  for c in cards:
                      if n >= 30: break
                      try:
                          pg.goto(c['u'], timeout=45000); pg.wait_for_timeout(800)
                          body = pg.inner_text("main") if pg.query_selector("main") else pg.inner_text("body")
                      except Exception as e:
                          continue
                      if re.search(r"客室総数|宿泊料金|チェックイン", body): continue
                      n += 1
                      out.append({"u": c['u'], "card": c['t'], "body": re.sub(r"\n{2,}", "\n", body)[:2500]})
                      time.sleep(0.7)
                  json.dump(out, open(f"shots/honda/{pf}.json", "w"), ensure_ascii=False, indent=0)
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && git add shots && git commit -qm "honda [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
