name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: prod check
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          mkdir -p shots
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          U = "https://petnavi.niconote.jp"
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(viewport={"width": 390, "height": 844})
              for s in ["karuizawa","nasu","izu","hakone","fujigoko","boso","ishikawa","tottori","okinawa","saitama"]:
                  r = pg.goto(f"{U}/travel-{s}.html", timeout=60000); print("GUIDE", s, r.status, pg.evaluate("document.querySelectorAll('.tg-i').length"))
              pg.screenshot(path="shots/p_saitama.png")
              pg.goto(f"{U}/travel.html?area=%E7%9F%B3%E5%B7%9D%E7%9C%8C", timeout=60000); pg.wait_for_timeout(4000)
              print("TVGD", pg.evaluate("(document.getElementById('tvgd')||{}).textContent"))
              pg.screenshot(path="shots/p_travel_area.png")
              e = pg.query_selector(".tv-ga")
              if e: e.scroll_into_view_if_needed(); pg.screenshot(path="shots/p_ga.png")
              pg.set_viewport_size({"width": 1280, "height": 900}); pg.goto(f"{U}/travel.html", timeout=60000); pg.wait_for_timeout(3000)
              e = pg.query_selector(".tv-rr")
              if e: e.scroll_into_view_if_needed()
              pg.screenshot(path="shots/p_rurubu_pc.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && git add shots && git commit -qm "prod [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
