name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              import urllib.parse, json
              pg.goto("https://petnavi.niconote.jp/api/msearch?v=1121a&q=" + urllib.parse.quote("ちゅーる"))
              d = json.loads(pg.inner_text("body"))
              ys = [x["u"] for x in d.get("items", []) if x["m"] == "y"]
              print("YURL", len(ys), [u.split("?")[0][:60] for u in ys[:2]], "vc" if any("valuecommerce" in u for u in ys) else "no-vc")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
