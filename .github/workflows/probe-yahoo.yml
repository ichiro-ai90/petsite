name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 楽天API切り分け
        env:
          AID: ${{ secrets.RAKUTEN_APP_ID }}
          AK: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, re, time, urllib.request, urllib.parse
          A, K = os.environ["AID"], os.environ["AK"]
          def m(t): return re.sub(r"pk_[A-Za-z0-9_-]+|[0-9a-f]{8}-[0-9a-f-]{27}", "*", " ".join(t.split()).replace(A, "*").replace(K, "*"))[:300]
          O = "https://petnavi.niconote.jp"
          base = {"applicationId": A, "accessKey": K, "format": "json", "formatVersion": "2"}
          tests = [
            ("ichiba", "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260401", {"keyword": "ちゅーる", "hits": "1"}, {"Origin": O, "Referer": O + "/"}),
            ("travel_kw", "https://openapi.rakuten.co.jp/engine/api/Travel/KeywordHotelSearch/20260731", {"keyword": "ペット", "hits": "1"}, {"Origin": O, "Referer": O + "/"}),
            ("travel_kw_noref", "https://openapi.rakuten.co.jp/engine/api/Travel/KeywordHotelSearch/20260731", {"keyword": "ペット", "hits": "1"}, {}),
            ("travel_kw_old", "https://openapi.rakuten.co.jp/engine/api/Travel/KeywordHotelSearch/20170426", {"keyword": "ペット", "hits": "1"}, {"Origin": O, "Referer": O + "/"}),
            ("travel_area", "https://openapi.rakuten.co.jp/engine/api/Travel/GetAreaClass/20140210", {}, {"Origin": O, "Referer": O + "/"}),
            ("travel_simple", "https://openapi.rakuten.co.jp/engine/api/Travel/SimpleHotelSearch/20170426", {"largeClassCode": "japan", "middleClassCode": "nagano", "smallClassCode": "karuizawa", "hits": "1"}, {"Origin": O, "Referer": O + "/"}),
          ]
          for name, u, q, h in tests:
              time.sleep(1.5)
              req = urllib.request.Request(u + "?" + urllib.parse.urlencode({**base, **q}), headers={"User-Agent": "petnavi-probe", **h})
              try:
                  r = urllib.request.urlopen(req, timeout=20); print("API", name, r.status, m(r.read().decode()[:200]))
              except urllib.error.HTTPError as e:
                  print("API", name, e.code, m(e.read().decode()))
          PY
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              import urllib.parse, json
              pg = b.new_page()
              pg.goto("https://petnavi.niconote.jp/api/msearch?v=1121e&q=" + urllib.parse.quote("ちゅーる"))
              d = json.loads(pg.inner_text("body")); ys = [x["u"] for x in d.get("items", []) if x["m"] == "y"]
              print("YURL", len(ys), "vc" if any("valuecommerce" in u and "892753714" in u for u in ys) else "no-vc", (ys[0][:110] if ys else ""))
              for q in ("", "ドッグラン"):
                  pg.goto("https://petnavi.niconote.jp/api/hotels?v=1121e&area=" + urllib.parse.quote("長野県") + "&q=" + urllib.parse.quote(q))
                  t = pg.inner_text("body"); 
                  try:
                      d = json.loads(t); print("HOT", q, "tot", d.get("tot"), "n", len(d.get("hotels", [])), "err", repr(d.get("err")), "u", (d.get("hotels") or [{}])[0].get("u", "")[:90])
                  except Exception as e:
                      print("HOT", q, "raw", t[:300])
              pg2 = b.new_page(viewport={"width": 390, "height": 900})
              pg2.goto("https://petnavi.niconote.jp/travel.html?v=1121e"); pg2.wait_for_timeout(3000)
              pg2.select_option("#tva", "長野県"); pg2.wait_for_timeout(5000)
              pg2.screenshot(path="travel.png", full_page=True)
              print("TVC", pg2.evaluate("document.getElementById('tvc').textContent"))
              print("NL", pg2.evaluate("document.querySelectorAll('#tvl a').length"))
              print("RR", pg2.evaluate("(document.querySelector('.tv-rr a')||{}).href||''")[:120])
              try:
                  pg2.click("#tvsp"); pg2.wait_for_timeout(6000)
                  print("WIN", pg2.evaluate("(document.getElementById('tvwin')||{}).textContent||''")[:200])
                  pg2.locator("#tvru").screenshot(path="roulette.png")
              except Exception as e: print("RUERR", str(e)[:200])
              pg3 = b.new_page(viewport={"width": 1440, "height": 900})
              pg3.goto("https://petnavi.niconote.jp/travel.html?v=1121e"); pg3.wait_for_timeout(3000)
              pg3.screenshot(path="travel1440.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
