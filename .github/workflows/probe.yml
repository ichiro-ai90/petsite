name: probe-v2
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      PETSITE_PROD: "1"
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python - <<'PY'
          import json, fetch_prices as f
          g = json.load(open("products.json", encoding="utf-8"))["groups"]
          for grp in g:
              try:
                  ps = f.search_products(grp)
                  print("##", grp["slug"], len(ps), " / ".join(f"{p['minPrice']}:{p['itemCount']}:{p['name'][:22]}" for p in ps[:4]))
              except Exception as e:
                  print("ERR", grp["slug"], e)
          PY
