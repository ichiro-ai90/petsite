name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          python - <<'PY'
          import json, re
          from playwright.sync_api import sync_playwright
          U = "https://petnavi.niconote.jp"
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(viewport={"width": 390, "height": 844})
              pg = ctx.new_page()
              pg.goto(U + "/travel.html?v=1123a"); pg.wait_for_timeout(2500)
              print("HDR", pg.evaluate("(document.querySelector('.hd-tv')||{}).innerText||'none'").replace("\n", " | "))
              print("FEATURE", pg.evaluate("!!document.querySelector('.tv-th')"))
              pg.screenshot(path="tv_top.png")
              pg.evaluate("""(()=>{var x=[...document.querySelectorAll('.tv-pf button')].find(e=>e.textContent.trim()==='長野県');x&&x.click()})()""")
              pg.wait_for_timeout(5000)
              h = pg.evaluate("(document.querySelector('.tv-rt a')||{}).href||''")
              print("RT", "hb.afl" if h.startswith("https://hb.afl.rakuten.co.jp/hgc/") else (h[:30] or "none"))
              pg.locator("#tvh").scroll_into_view_if_needed(); pg.wait_for_timeout(500); pg.screenshot(path="tv_res.png")
              cbs = pg.locator("[data-pk]")
              print("PREP n", cbs.count())
              cbs.nth(0).check(); cbs.nth(1).check()
              print("PREP after", pg.evaluate("document.getElementById('tvprn').textContent"))
              pg.locator("#prep").scroll_into_view_if_needed(); pg.wait_for_timeout(400); pg.screenshot(path="tv_prep.png")
              if h:
                  with ctx.expect_page() as np:
                      pg.click(".tv-rt a")
                  np.value.close()
              pg.evaluate("()=>{var t=JSON.parse(localStorage.getItem('pn_trip')||'null');if(t){t.t=Date.now()-60000;localStorage.setItem('pn_trip',JSON.stringify(t))}}")
              pg.goto(U + "/index.html?v=1123a"); pg.wait_for_timeout(2500)
              print("TVBK", pg.evaluate("(document.getElementById('tvbk')||{}).innerText||'none'").replace("\n", " | "))
              print("TVBAR", pg.evaluate("(document.getElementById('tvbar')||{}).innerText||'none'").replace("\n", " "))
              pg.screenshot(path="top_return.png")
              g = json.loads(pg.evaluate("document.getElementById('gdata').textContent"))
              bad = [x["n"] for x in g if re.search(r"療法食|サポート|[cdikjlrwz]/d|プリスクリプション|ベテリナリー", x["n"], re.I)]
              print("GACHA", len(g), "ryouhou", len(bad), bad[:3])
              pc = b.new_page(viewport={"width": 1440, "height": 900})
              pc.goto(U + "/travel.html?v=1123a"); pc.wait_for_timeout(2500); pc.screenshot(path="tv_pc.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
