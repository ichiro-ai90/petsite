name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 写真の候補（Pexels・無料・商用可）
        run: |
          pip -q install pillow
          mkdir -p cand
          for id in 16395150 7329892 11043682 13424995 19369860 10361808 33757023 5263848 4520484 4520482 3586056 10884423 2013665 7455192 28914189 16147936 27771836 2078845 4365561 2053815 4365564 8434726; do
            curl -sfL "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600" -o cand/$id.jpg || echo "fail $id"
          done
          python - <<'PY'
          from PIL import Image, ImageDraw
          import glob, os
          fs = sorted(glob.glob("cand/*.jpg"))
          W = 300; cols = 6; rows = (len(fs)+cols-1)//cols
          sheet = Image.new("RGB", (W*cols, (W+20)*rows), "white"); d = ImageDraw.Draw(sheet)
          for i, f in enumerate(fs):
              im = Image.open(f).convert("RGB"); im.thumbnail((W, W)); x, y = (i%cols)*W, (i//cols)*(W+20)
              sheet.paste(im, (x, y)); d.text((x+4, y+W+4), os.path.basename(f)+f" {Image.open(f).size}", fill="black")
          sheet.save("sheet.jpg", quality=80)
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && git add cand sheet.jpg && git commit -qm "cand [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
