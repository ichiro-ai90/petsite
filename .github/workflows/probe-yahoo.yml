name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              for w, h, n in ((1440, 900, "pc"), (390, 1000, "sp")):
                  pg = b.new_page(viewport={"width": w, "height": h})
                  pg.goto("https://petnavi.niconote.jp/?v=1118a"); pg.wait_for_timeout(3000); pg.screenshot(path=f"home_{n}.png")
                  print(n, "scrollWidth", pg.evaluate("document.documentElement.scrollWidth"))
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && mv *.png shots/ && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
