name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: prod check
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null 2>&1 || true
          mkdir -p shots
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          U = "https://petnavi.niconote.jp"
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(viewport={"width": 390, "height": 844})
              r = pg.goto(f"{U}/travel-saitama.html", timeout=60000); print("SAITAMA", r.status, pg.evaluate("document.querySelectorAll('.tg-i').length"))
              pg.screenshot(path="shots/q_saitama.png")
              pg.evaluate("document.querySelectorAll('.tg-i')[8].scrollIntoView()"); pg.screenshot(path="shots/q_saitama_shop.png")
              r = pg.goto(f"{U}/travel-iwate.html", timeout=60000)
              print("IWATE", r.status, pg.evaluate("[...document.querySelectorAll('.tg-s')].map(a=>a.textContent).join(' / ')"))
              pg.evaluate("[...document.querySelectorAll('.tg-s')].find(a=>a.textContent.includes('Honda')).closest('li').scrollIntoView()"); pg.screenshot(path="shots/q_iwate.png")
              pg.goto(f"{U}/travel.html", timeout=60000); pg.wait_for_timeout(2500)
              print("GA_SAITAMA", pg.evaluate("!!document.querySelector('.tv-ga a[href=\"travel-saitama.html\"]')"))
              pg.query_selector(".tv-ga").scroll_into_view_if_needed(); pg.screenshot(path="shots/q_ga.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && git add shots && git commit -qm "prod [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
