name: probe-yahoo
on:
  push:
    branches: [dev/probe-yahoo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 画面
        run: |
          pip -q install playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python - <<'PY'
          import json, re, urllib.parse
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 390, "height": 900})
              for u in ["https://kw.travel.rakuten.co.jp/keyword/Search.do?charset=utf-8&f_query=" + urllib.parse.quote("ペット 長野県"),
                        "https://travel.rakuten.co.jp/yado/nagano/",
                        "https://travel.rakuten.co.jp/special/pet/"]:
                  try:
                      r = pg.goto(u, timeout=45000); pg.wait_for_timeout(4000)
                      n = pg.evaluate("document.querySelectorAll('a[href*=\"/HOTEL/\"],a[href*=\"hotelinfo\"]').length")
                      print("TRV", r.status if r else None, pg.url[:120], "|", pg.title()[:60], "| hotels", n, "| pet", pg.content().count("ペット"))
                  except Exception as e: print("TRV ERR", u[:60], str(e)[:120])
              pg.goto("https://kw.travel.rakuten.co.jp/keyword/Search.do?charset=utf-8&f_query=" + urllib.parse.quote("ペット 長野県")); pg.wait_for_timeout(3000); pg.screenshot(path="kw.png")
              b.close()
          PY
          git config user.name ichiro-ai90; git config user.email ichiro-ai90@users.noreply.github.com
          git checkout -b tmp && mkdir -p shots && (mv *.png shots/ || true) && git add shots && git commit -qm "shots [skip ci]" && git push -q origin HEAD:dev/probe-shots --force
